<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход оператора</title>
<style>
body{font-family:Segoe UI;background:#f3f4f6;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:white;padding:30px;border-radius:24px;width:360px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:12px}
button{background:#1d4d3a;color:white;border:0;font-weight:800}

@media(max-width:600px){
    body{height:auto;min-height:100vh;padding:16px;background:linear-gradient(135deg,#0f5132,#167a3c)}
    .box{width:100%;max-width:420px;border-radius:28px;box-shadow:0 22px 60px rgba(0,0,0,.22)}
    h1{font-size:30px;text-align:center}
    input,button{font-size:18px;padding:16px;border-radius:18px}
}

body{
margin:0!important;
min-height:100vh!important;
display:flex!important;
align-items:center!important;
justify-content:center!important;
padding:18px!important;
background:linear-gradient(135deg,#0f172a,#166534)!important;
font-family:Segoe UI,system-ui,sans-serif!important;
box-sizing:border-box;
}
.box,.login{
width:min(100%,430px)!important;
margin:auto!important;
padding:28px!important;
border-radius:30px!important;
background:rgba(255,255,255,.98)!important;
box-shadow:0 30px 80px rgba(0,0,0,.25)!important;
}
input,button,select{
width:100%!important;
padding:16px!important;
font-size:17px!important;
border-radius:18px!important;
box-sizing:border-box!important;
}
button{
background:linear-gradient(135deg,#166534,#15803d)!important;
color:white!important;
font-weight:900!important;
border:0!important;
}
@media(orientation:landscape){
.box,.login{
width:min(92vw,720px)!important;
}
}
</style>
</head>
<body>
<div class="box">
    <h1>🧑‍💼 Вход оператора</h1>

    <input id="login" placeholder="Логин">
    <input id="password" type="password" placeholder="Пароль">

    <button onclick="go()">Войти</button>

    <p style="color:#64748b;text-align:center">Логин и пароль выдаёт администратор буфета.</p>
</div>

<script>
async function go(){
    const res = await fetch('/api/operator/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            login:login.value,
            password:password.value
        })
    })

    const data = await res.json()

    if(!data.success){
        alert(data.error || 'Ошибка')
        return
    }

    location.href = '/operator'
}
</script>
</body>
</html>
