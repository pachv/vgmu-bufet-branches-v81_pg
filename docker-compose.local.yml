services:
  app:
    build:
      context: .
      dockerfile: deployment/docker/main.Dockerfile

    container_name: vgmu-bufet-app

    restart: unless-stopped

    ports:
      - "${APP_PORT}:${APP_PORT}"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine

    container_name: vgmu-bufet-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_EXTERNAL_PORT}:${DB_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: